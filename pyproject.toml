[project]
name = "whisper-project"
version = "0.1.0"
description = ""
authors = [
    {name = "davips",email = "dpsabc@gmail.com"}
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "faster-whisper (>=1.2.1,<2.0.0)",
    "av (<19)",
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "python-multipart (>=0.0.32,<0.0.33)"
]


[project.optional-dependencies]
cuda = ["nvidia-cublas-cu12 (>=12.9.2.10,<13.0.0.0)", "nvidia-cudnn-cu12 (==9.*)"]
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "dictate" }]

[project.scripts]
dictate = "dictate.main:main"
